<div class="wrap">
  <header class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><clipPath id="lensL"><circle cx="88" cy="110" r="21"/></clipPath></defs>
<rect x="0" y="0" width="200" height="200" rx="44" fill="#E07B39"/>
<path d="M42 96 L48 30 L94 62 Z" fill="#2A2933" stroke="#2A2933" stroke-width="6" stroke-linejoin="round"/>
<path d="M158 96 L152 30 L106 62 Z" fill="#2A2933" stroke="#2A2933" stroke-width="6" stroke-linejoin="round"/>
<circle cx="100" cy="114" r="66" fill="#2A2933"/>
<text x="60" y="70" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-weight="700" font-size="20" fill="#F6E7C8">A</text>
<text x="140" y="70" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-weight="700" font-size="20" fill="#F6E7C8">E</text>
<circle cx="112" cy="110" r="21" fill="#F2C14E" clip-path="url(#lensL)"/>
<circle cx="88" cy="110" r="21" fill="none" stroke="#F6E7C8" stroke-width="4"/>
<circle cx="112" cy="110" r="21" fill="none" stroke="#F6E7C8" stroke-width="4"/>
<text x="79" y="115" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-weight="700" font-size="14" fill="#F6E7C8">I</text>
<text x="122" y="115" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-weight="700" font-size="14" fill="#F6E7C8">O</text>
<path d="M95 139 L105 139 L100 145 Z" fill="#F2A3A0"/>
<path d="M86 152 Q93 162 100 152 Q107 162 114 152" fill="none" stroke="#F6E7C8" stroke-width="4" stroke-linecap="round"/>
<path d="M66 140 L34 134 M66 148 L36 152 M134 140 L166 134 M134 148 L164 152" stroke="#F6E7C8" stroke-width="3" stroke-linecap="round"/></svg>
    <div><h1>mAEIOw<span class="testflag">Test</span></h1><p>Categorical logic: All, No, Some, Some…not.</p></div>
  </header>
  <nav class="appnav" aria-label="Sections"><a href="index.html">Workbench</a><a href="diagrams.html" aria-current="page">Diagrams</a><a href="learn.html">Learn</a></nav>
  <section class="card" aria-label="Syllogism">
    <div class="srow">
      <label class="dlabel" for="m1">Mood</label>
      <select id="m1" class="dsel" aria-label="Major premise"><option>A</option><option>E</option><option>I</option><option>O</option></select>
      <select id="m2" class="dsel" aria-label="Minor premise"><option>A</option><option>E</option><option>I</option><option>O</option></select>
      <select id="m3" class="dsel" aria-label="Conclusion"><option>A</option><option>E</option><option>I</option><option>O</option></select>
      <label class="dlabel" for="fig">Figure</label>
      <select id="fig" class="dsel"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
    </div>
    <div class="srow names"><label>S <input id="nS" placeholder="e.g. Greeks"></label><label>M <input id="nM" placeholder="humans"></label><label>P <input id="nP" placeholder="mortals"></label></div>
    <label class="dchk"><input type="checkbox" id="imp"> Existential import (every term names something)</label>
    <ol class="argshow" id="argshow"></ol>
    <div id="verdict"></div>
  </section>
  <nav class="dtabs" id="dtabs" role="tablist" aria-label="Diagram" style="grid-template-columns:repeat(5,minmax(0,1fr))"><button role="tab" data-v="venn">Venn</button><button role="tab" data-v="carroll">Carroll</button><button role="tab" data-v="euler">Euler</button><button role="tab" data-v="square">Square</button><button role="tab" data-v="moods">Moods</button></nav>
  <section class="card dview" id="view" aria-live="polite"></section>
</div>
